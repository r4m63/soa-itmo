openapi: 3.1.0

info:
  title: API (Movie Service, Oscar Service)
  description: SOA openapi specification

tags:
  - name: Movies service
  - name: Oscar service

paths:

  /movies:
    get:
      tags: [ Movies service ]
      summary: Получить страницу фильмов
      description: Получение фильмов с фильтрацией, сортировкой и пагинацией.
      operationId: listMovies
      parameters:
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница фильмов; `items` может быть пустым массивом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [ Movies service ]
      summary: Добавить фильм
      description: Создаёт фильм. `id` и `creationDate` генерируются сервером.
      operationId: createMovie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
            examples:
              movie:
                summary: Корректный фильм
                value:
                  name: The Example
                  coordinates: { x: 10, y: -25 }
                  oscarsCount: 2
                  genre: DRAMA
                  mpaaRating: PG_13
                  screenwriter:
                    name: Alex Writer
                    passportID: AB12345
                    hairColor: BLUE
                    nationality: FRANCE
      responses:
        '201':
          description: Фильм создан.
          headers:
            Location:
              description: URL созданного фильма.
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /movies/min-name:
    get:
      tags: [ Movies service ]
      summary: Получить фильм с минимальным именем
      description: |
        Возвращает любой один фильм, чьё `name` лексикографически минимально
        среди коллекции. Сравнение выполняется по правилам сортировки хранилища;
        при равенстве нескольких имён выбирается фильм с минимальным `id`.
      operationId: getMovieWithMinimumName
      responses:
        '200':
          description: Найденный фильм.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '404':
          description: Коллекция пуста.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '500': { $ref: '#/components/responses/InternalError' }

  /movies/name-starts-with:
    get:
      tags: [ Movies service ]
      summary: Найти фильмы по началу имени
      description: Возвращает все фильмы, имя которых начинается с `prefix`. Поиск чувствителен к регистру.
      operationId: findMoviesByNamePrefix
      parameters:
        - name: prefix
          in: query
          required: true
          description: Непустая начальная подстрока имени.
          schema: { type: string, minLength: 1 }
          example: The
      responses:
        '200':
          description: Найденные фильмы; при отсутствии совпадений возвращается пустой массив.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /movies/by-genre/{genre}:
    delete:
      tags: [ Movies service ]
      summary: Удалить все фильмы заданного жанра
      description: |
        Удаляет все объекты, поле `genre` которых равно значению в URL.
        Фильмы с `genre: null` не удаляются.
      operationId: deleteMoviesByGenre
      parameters:
        - $ref: '#/components/parameters/GenrePath'
      responses:
        '200':
          description: Операция выполнена, даже если совпадений не было.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /movies/{id}:
    parameters:
      - $ref: '#/components/parameters/MovieId'
    get:
      tags: [ Movies service ]
      summary: Получить фильм по идентификатору
      description: Возвращает один сохранённый фильм.
      operationId: getMovieById
      responses:
        '200':
          description: Фильм найден.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [ Movies service ]
      summary: Полностью обновить фильм
      description: |
        Заменяет изменяемые поля существующего фильма. Значения `id` и
        `creationDate` сохраняются и потому отсутствуют в теле запроса.
      operationId: updateMovie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovieInput' }
      responses:
        '200':
          description: Обновлённый фильм.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Movie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [ Movies service ]
      summary: Удалить фильм
      description: Безвозвратно удаляет объект с указанным идентификатором.
      operationId: deleteMovie
      responses:
        '204': { description: Фильм удалён; тело ответа отсутствует. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /oscar/movies/reward-r:
    post:
      tags: [ Oscar service ]
      summary: Наградить фильмы рейтинга R
      description: |
        Атомарно увеличивает `oscarsCount` на 1 у каждого фильма с
        `mpaaRating = R`. При отсутствии таких фильмов операция успешна и
        возвращает `affectedMovies: 0`.
      operationId: rewardRRatedMovies
      responses:
        '200':
          description: Награды начислены.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkOperationResult' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '500': { $ref: '#/components/responses/InternalError' }

  /oscar/genres/redistribute-rewards/{from-genre}/{to-genre}:
    post:
      tags: [ Oscar service ]
      summary: Перераспределить Оскары между жанрами
      description: |
        Атомарно суммирует все `oscarsCount` фильмов жанра `from-genre`, затем
        распределяет эту сумму максимально равномерно между фильмами жанра
        `to-genre`. У исходных фильмов после операции устанавливается минимально
        допустимое значение `oscarsCount = 1`.

        Поскольку модель запрещает нулевое число наград, фактически переносится
        сумма `oscarsCount - 1` каждого исходного фильма. Каждый целевой фильм
        получает `floor(transferredOscars / targetCount)`, а остаток по одному
        начисляется фильмам с наименьшими `id`. Если целевых фильмов нет,
        возвращается `409` и данные не изменяются. Жанры должны различаться.
      operationId: redistributeOscarRewards
      parameters:
        - name: from-genre
          in: path
          required: true
          description: Жанр, у фильмов которого изымаются награды сверх одной.
          schema: { $ref: '#/components/schemas/MovieGenre' }
        - name: to-genre
          in: path
          required: true
          description: Жанр, между фильмами которого распределяются награды.
          schema: { $ref: '#/components/schemas/MovieGenre' }
      responses:
        '200':
          description: Награды перераспределены.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedistributionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  schemas:
    Movie:
      type: object
      description: Сохранённый фильм с серверными полями.
      required: [ id, name, coordinates, creationDate, oscarsCount, mpaaRating ]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Уникальный автоматически сгенерированный идентификатор.
          examples: [ 42 ]
        name: { type: string, minLength: 1, description: Непустое название фильма., examples: [ The Example ] }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        creationDate:
          type: string
          format: date
          readOnly: true
          description: Дата создания записи, автоматически заданная сервером.
          examples: [ '2026-09-20' ]
        oscarsCount: { type: integer, format: int32, minimum: 1, description: Число наград; строго больше нуля., examples: [ 2 ] }
        genre:
          description: Жанр фильма; может отсутствовать или быть null.
          oneOf:
            - $ref: '#/components/schemas/MovieGenre'
            - type: 'null'
        mpaaRating: { $ref: '#/components/schemas/MpaaRating' }
        screenwriter:
          description: Сценарист; по условию поле не обязательно и может быть null.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
      additionalProperties: false
    MovieInput:
      type: object
      description: Данные для создания или полного обновления фильма.
      required: [ name, coordinates, oscarsCount, mpaaRating ]
      properties:
        name: { type: string, minLength: 1, description: Непустое название фильма. }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        oscarsCount: { type: integer, format: int32, minimum: 1 }
        genre:
          oneOf:
            - $ref: '#/components/schemas/MovieGenre'
            - type: 'null'
        mpaaRating: { $ref: '#/components/schemas/MpaaRating' }
        screenwriter:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
      additionalProperties: false
    Coordinates:
      type: object
      required: [ x, y ]
      properties:
        x: { type: integer, format: int32, description: Координата X без дополнительных ограничений. }
        y: { type: integer, format: int64, description: Координата Y без дополнительных ограничений. }
      additionalProperties: false
    Person:
      type: object
      required: [ name, nationality ]
      properties:
        name: { type: string, minLength: 1, description: Непустое имя сценариста. }
        passportID:
          description: Идентификатор паспорта длиной не менее 5 символов; может быть null.
          oneOf:
            - type: string
              minLength: 5
            - type: 'null'
        hairColor:
          description: Цвет волос; может быть null.
          oneOf:
            - $ref: '#/components/schemas/Color'
            - type: 'null'
        nationality: { $ref: '#/components/schemas/Country' }
      additionalProperties: false
    MovieGenre:
      type: string
      enum: [ ACTION, DRAMA, COMEDY, MUSICAL, HORROR ]
    MpaaRating:
      type: string
      enum: [ G, PG, PG_13, R, NC_17 ]
    Color:
      type: string
      enum: [ RED, BLUE, ORANGE, WHITE ]
    Country:
      type: string
      enum: [ RUSSIA, UNITED_KINGDOM, FRANCE, SPAIN, NORTH_KOREA ]
    MoviePage:
      type: object
      required: [ items, page, size, totalElements, totalPages ]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Movie' }
        page: { type: integer, minimum: 0, description: 'Текущий номер страницы, начиная с 0.' }
        size: { type: integer, minimum: 1, description: Запрошенный размер страницы. }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
      additionalProperties: false
    DeletionResult:
      type: object
      required: [ deletedCount ]
      properties:
        deletedCount: { type: integer, minimum: 0, description: Число удалённых фильмов. }
      additionalProperties: false
    BulkOperationResult:
      type: object
      required: [ affectedMovies ]
      properties:
        affectedMovies: { type: integer, minimum: 0 }
      additionalProperties: false
    RedistributionResult:
      type: object
      required: [ sourceMovies, targetMovies, transferredOscars ]
      properties:
        sourceMovies: { type: integer, minimum: 0 }
        targetMovies: { type: integer, minimum: 1 }
        transferredOscars: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    Problem:
      type: object
      description: Единый ответ об ошибке в стиле RFC 9457 Problem Details.
      required: [ type, title, status, detail, instance, timestamp ]
      properties:
        type: { type: string, format: uri-reference, description: Идентификатор типа ошибки. }
        title: { type: string, description: Краткое название ошибки. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Понятное человеку объяснение. }
        instance: { type: string, format: uri-reference, description: URL конкретного запроса. }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          description: Детали ошибок валидации, если применимо.
          items:
            type: object
            required: [ field, message ]
            properties:
              field: { type: string, examples: [ oscarsCount ] }
              message: { type: string, examples: [ must be greater than 0 ] }
            additionalProperties: false
      additionalProperties: false

  parameters:
    MovieId:
      name: id
      in: path
      required: true
      description: Положительный идентификатор фильма.
      schema: { type: integer, format: int32, minimum: 1 }

    GenrePath:
      name: genre
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MovieGenre' }

    Filter:
      name: filter
      in: query
      required: false
      description: |
        Универсальный фильтр коллекции Movie.
        Параметр может быть указан несколько раз.
        Все переданные фильтры объединяются через AND.
        
        Формат: `field;operator;value`. Если operator = `isNull` или `notNull`, то: `field;operator`.
        
        field и operator:
        
        - `id`: eq, ne, gt, gte, lt, lte
        - `name`: eq, ne, contains, startsWith
        - `coordinates.x`: eq, ne, gt, gte, lt, lte
        - `coordinates.y`: eq, ne, gt, gte, lt, lte
        - `creationDate`: eq, ne, gt, gte, lt, lte
        - `oscarsCount`: eq, ne, gt, gte, lt, lte
        - `genre`: eq, ne, isNull, notNull
        - `mpaaRating`: eq, ne
        - `screenwriter`: isNull, notNull
        - `screenwriter.name`: eq, ne, contains, startsWith
        - `screenwriter.passportID`: eq, ne, contains, startsWith, isNull, notNull
        - `screenwriter.hairColor`: eq, ne, isNull, notNull
        - `screenwriter.nationality`: eq, ne
        
        Значения `creationDate` передаются в формате YYYY-MM-DD.
        
        MovieGenre: ACTION, DRAMA, COMEDY, MUSICAL, HORROR.
        MpaaRating: G, PG, PG_13, R, NC_17.
        Color: RED, BLUE, ORANGE, WHITE.
        Country: RUSSIA, UNITED_KINGDOM, FRANCE, SPAIN, NORTH_KOREA.
        
        - eq - equal - равно (=)
        - ne - not equal - не равно (!=)
        - gt - greater than - больше (>)
        - gte - greater than or equal - больше или равно (>=)
        - lt - less than - меньше (<)
        - lte - less than or equal - меньше или равно (<=)
        - contains - contains - содержит подстроку
        - startsWith - starts with - начинается с подстроки
        - isNull - is null - значение равно null
        - notNull - not null - значение не равно null
        
        Пример: `?filter=genre;eq;DRAMA&filter=oscarsCount;gte;3&filter=name;contains;Star`
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      examples:
        multipleFilters:
          summary: Несколько одновременных фильтров
          value:
            - genre;eq;DRAMA
            - oscarsCount;gte;3
            - name;contains;Star

    Sort:
      name: sort
      in: query
      required: false
      description: |
        Многоуровневая сортировка коллекции Movie.
        Параметр может быть указан несколько раз.
        Порядок параметров в URL определяет приоритет сортировки.
        
        Формат: `field;direction`
        
        field:
        `id`, `name`, `coordinates.x`, `coordinates.y`, `creationDate`,
        `oscarsCount`, `genre`, `mpaaRating`, `screenwriter.name`,
        `screenwriter.passportID`, `screenwriter.hairColor`,
        `screenwriter.nationality`.
        
        direction: `asc` или `desc`
        
        Пример: `?sort=genre;asc&sort=oscarsCount;desc&sort=name;asc`
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(id|name|coordinates\.(x|y)|creationDate|oscarsCount|genre|mpaaRating|screenwriter\.(name|passportID|hairColor|nationality));(asc|desc)$'
      examples:
        multipleSort:
          summary: Многоуровневая сортировка
          value:
            - genre;asc
            - oscarsCount;desc
            - name;asc

    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 0.
      schema:
        type: integer
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: Количество элементов на странице.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Некорректный синтаксис запроса, параметр URL или JSON.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: JSON корректен синтаксически, но нарушает ограничения модели.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Фильм с указанным идентификатором не найден.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Операция конфликтует с текущим состоянием данных.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamError:
      description: Oscar Service не смог получить корректный ответ от Movie Service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Непредвиденная внутренняя ошибка сервера.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
