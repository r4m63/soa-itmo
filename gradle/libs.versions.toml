[versions]
java = "21"
jakartaee = "11.0.0"
jakarta-persistence = "3.2.0"
flyway = "13.10.3"
lombok = "1.18.48"
jakarta-validation = "3.1.1"
jakarta-data = "1.0.2"
jakarta-ws-rs = "4.0.0"
jersey = "4.0.2"
spring-framework = "7.0.9"
slf4j = "2.0.18"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"

[libraries]
jakartaee-api = { module = "jakarta.platform:jakarta.jakartaee-api", version.ref = "jakartaee" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jakarta-data-api = { module = "jakarta.data:jakarta.data-api", version.ref = "jakarta-data" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
jersey-server = { module = "org.glassfish.jersey.core:jersey-server", version.ref = "jersey" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-framework" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
jakarta-ws-rs-api = { module = "jakarta.ws.rs:jakarta.ws.rs-api", version.ref = "jakarta-ws-rs" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
